<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240,height=320">
<title>Spotify</title>

<style>
body {
    margin: 0;
    background: #121212;
    color: white;
    font-family: Arial;
}

#app {
    padding: 12px;
}

button {
    display: block;
    width: 100%;
    margin: 7px 0;
    padding: 12px;
    border: 0;
    border-radius: 6px;
    background: #282828;
    color: white;
    font-size: 13px;
}

button:active {
    background: #1ed760;
    color: black;
}
</style>
</head>

<body>

<div id="app">

<h2>♫ SPOTIFY</h2>

<button onclick="buscar()">🔎 Buscar</button>
<button onclick="playlists()">🎵 Mis playlists</button>
<button onclick="canciones()">♥ Mis canciones</button>
<button onclick="player()">▶ Reproducción actual</button>

<p id="status">Widget funcionando</p>

</div>

<script>

function buscar() {
    document.getElementById("status").innerText =
    "🔎 Búsqueda seleccionada";
}

function playlists() {
    document.getElementById("status").innerText =
    "🎵 Playlists seleccionadas";
}

function canciones() {
    document.getElementById("status").innerText =
    "♥ Canciones seleccionadas";
}

function player() {
    document.getElementById("status").innerText =
    "▶ Reproductor seleccionado";
}

</script>

</body>
</html>
