<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240,height=320">
<title>Spotify</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    width: 240px;
    height: 320px;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#app {
    width: 240px;
    height: 320px;
    padding: 12px;
    text-align: center;
}

h1 {
    font-size: 20px;
    margin: 5px 0 18px;
}

#login {
    margin-top: 80px;
}

button {
    background: #fff;
    color: #000;
    border: 0;
    padding: 8px 12px;
    font-size: 14px;
}

#player {
    display: none;
}

#cover {
    width: 100px;
    height: 100px;
    margin: auto;
    border: 2px solid white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
}

#track {
    margin-top: 12px;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
}

#artist {
    font-size: 11px;
    margin-top: 5px;
}

#status {
    font-size: 11px;
    margin-top: 10px;
}

.controls {
    margin-top: 18px;
    font-size: 22px;
}

.help {
    position: absolute;
    bottom: 5px;
    width: 240px;
    left: 0;
    font-size: 9px;
}
</style>
</head>

<body>

<div id="app">

    <h1>SPOTIFY</h1>

    <div id="login">
        <button id="loginButton">LOGIN</button>
    </div>

    <div id="player">

        <div id="cover">♪</div>

        <div id="track">Esperando...</div>

        <div id="artist"></div>

        <div id="status">Conectando...</div>

        <div class="controls">
            ◀ &nbsp; ▶ &nbsp; ▶
        </div>

        <div class="help">
            ← anterior &nbsp; ENTER play/pause &nbsp; → siguiente
        </div>

    </div>

</div>

<script src="https://sdk.scdn.co/spotify-player.js"></script>

<script>

const CLIENT_ID = "8b61d543ab204a01986a47f38e419304";

const REDIRECT_URI =
"https://cristiandavoh-svg.github.io/Cloudphone-widget/callback";

const SCOPES =
"streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state";


// -------------------------
// PKCE
// -------------------------

function randomString(length) {

    const chars =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

    let result = "";

    const values =
        crypto.getRandomValues(new Uint8Array(length));

    for (let i = 0; i < length; i++) {
        result += chars[values[i] % chars.length];
    }

    return result;
}


async function sha256(plain) {

    const encoder = new TextEncoder();

    const data = encoder.encode(plain);

    return crypto.subtle.digest("SHA-256", data);
}


function base64url(buffer) {

    return btoa(
        String.fromCharCode(...new Uint8Array(buffer))
    )
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=/g, "");
}


async function login() {

    const verifier = randomString(64);

    const challenge =
        base64url(await sha256(verifier));

    localStorage.setItem(
        "spotify_verifier",
        verifier
    );

    const params = new URLSearchParams({

        client_id: CLIENT_ID,

        response_type: "code",

        redirect_uri: REDIRECT_URI,

        scope: SCOPES,

        code_challenge_method: "S256",

        code_challenge: challenge
    });

    window.location.href =
        "https://accounts.spotify.com/authorize?" +
        params.toString();
}


// -------------------------
// Obtener token
// -------------------------

async function getToken(code) {

    const verifier =
        localStorage.getItem("spotify_verifier");

    const response = await fetch(
        "https://accounts.spotify.com/api/token",
        {
            method: "POST",

            headers: {
                "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body: new URLSearchParams({

                client_id: CLIENT_ID,

                grant_type:
                "authorization_code",

                code: code,

                redirect_uri:
                REDIRECT_URI,

                code_verifier:
                verifier
            })
        }
    );

    const data = await response.json();

    if (!data.access_token) {

        console.log(data);

        throw new Error(
            "No se pudo obtener el token"
        );
    }

    localStorage.setItem(
        "spotify_token",
        data.access_token
    );

    return data.access_token;
}


// -------------------------
// Spotify Player
// -------------------------

window.onSpotifyWebPlaybackSDKReady =
function() {

    const token =
        localStorage.getItem("spotify_token");

    if (!token) return;

    document.getElementById("login").style.display =
        "none";

    document.getElementById("player").style.display =
        "block";

    const player =
        new Spotify.Player({

            name: "Nokia Cloud Music",

            getOAuthToken: callback => {

                callback(
                    localStorage.getItem(
                        "spotify_token"
                    )
                );

            },

            volume: 0.7
        });


    player.addListener(
        "ready",
        ({ device_id }) => {

            window.spotifyDeviceId =
                device_id;

            document.getElementById("status")
                .textContent =
                "LISTO";

        }
    );


    player.addListener(
        "player_state_changed",
        state => {

            if (!state) return;

            const track =
                state.track_window
                    .current_track;

            document.getElementById("track")
                .textContent =
                track.name;

            document.getElementById("artist")
                .textContent =
                track.artists
                    .map(a => a.name)
                    .join(", ");

            document.getElementById("status")
                .textContent =
                state.paused
                ? "PAUSADO"
                : "REPRODUCIENDO";
        }
    );


    player.addListener(
        "initialization_error",
        ({ message }) => {

            document.getElementById("status")
                .textContent =
                "ERROR: " + message;
        }
    );


    player.addListener(
        "authentication_error",
        ({ message }) => {

            document.getElementById("status")
                .textContent =
                "ERROR LOGIN";
        }
    );


    player.connect();
};


// -------------------------
// Botón login
// -------------------------

document
.getElementById("loginButton")
.addEventListener(
    "click",
    login
);


// -------------------------
// Callback
// -------------------------

(async function() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const code =
        params.get("code");

    const error =
        params.get("error");

    if (error) {

        document.getElementById("login")
            .innerHTML =
            "Spotify rechazó el acceso.";

        return;
    }

    if (code) {

        try {

            await getToken(code);

            window.history.replaceState(
                {},
                document.title,
                REDIRECT_URI
            );

            location.reload();

        } catch (e) {

            document.getElementById("login")
                .innerHTML =
                "Error al iniciar Spotify.";
        }
    }

})();
</script>

</body>
</html>
