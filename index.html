/* =================================================
   PKCE
================================================= */

function randomString(length){

    const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

    const values =
    crypto.getRandomValues(
        new Uint8Array(length)
    );

    let result = "";

    for(
        let i=0;
        i<length;
        i++
    ){

        result +=
        chars[
            values[i] % chars.length
        ];

    }

    return result;
}


async function sha256(value){

    const data =
    new TextEncoder()
    .encode(value);

    return crypto.subtle.digest(
        "SHA-256",
        data
    );
}


function base64url(buffer){

    let result = "";

    const bytes =
    new Uint8Array(buffer);

    for(
        const byte of bytes
    ){

        result +=
        String.fromCharCode(byte);

    }

    return btoa(result)
        .replace(/\+/g,"-")
        .replace(/\//g,"_")
        .replace(/=+$/,"");
}

async function login(){

        base64url(

        const state =

        localStorage.setItem(
            "spotify_verifier",

        localStorage.setItem(
            "spotify_state",
            state
        );


        const params =
        new URLSearchParams({

            client_id:

            response_type:
            "code",

            redirect_uri:
            REDIRECT_URI,

            scope:
            SCOPES,

            state:
            state,

            code_challenge_method:
            "S256",

            code_challenge:
            challenge

        });


        window.location.href =
        "https://accounts.spotify.com/authorize?"
        + params.toString();


    }catch(error){

        console.error(error);

        loginStatus.textContent =
        "ERROR";

    }

}

/* =================================================
   TOKEN
================================================= */

async function exchangeCode(code){

    const verifier =
    localStorage.getItem(
        "spotify_verifier"
    );


    const response =
    await fetch(
        "https://accounts.spotify.com/api/token",
        {

            method:"POST",

            headers:{
                "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body:
            new URLSearchParams({

                client_id:
                CLIENT_ID,

                grant_type:
                "authorization_code",

                code:
                code,

                redirect_uri:
                REDIRECT_URI,

                code_verifier:
                verifier

            })

        }
    );


    const data =
    await response.json();


    if(!response.ok){

        throw new Error(
            data.error_description ||
            "Token error"
        );

    }


    localStorage.setItem(
        "spotify_access_token",
        data.access_token
    );


    if(data.refresh_token){

        localStorage.setItem(
            "spotify_refresh_token",
            data.refresh_token
        );

    }


    return data.access_token;

}


async function refreshToken(){

    const refresh =
    localStorage.getItem(
        "spotify_refresh_token"
    );


    if(!refresh){

        throw new Error(
            "No refresh token"
        );

    }


    const response =
    await fetch(
        "https://accounts.spotify.com/api/token",
        {

            method:"POST",

            headers:{
                "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body:
            new URLSearchParams({

                client_id:
                CLIENT_ID,

                grant_type:
                "refresh_token",

                refresh_token:
                refresh

            })

        }
    );


    const data =
    await response.json();


    if(!response.ok){

        throw new Error(
            "Refresh failed"
        );

    }


    localStorage.setItem(
        "spotify_access_token",
        data.access_token
    );


    return data.access_token;

}


async function getToken(){

    let token =
    localStorage.getItem(
        "spotify_access_token"
    );


    if(token){

        return token;

    }


    const params =
    new URLSearchParams(
        window.location.search
    );


    const code =
    params.get("code");


    if(code){

        token =
        await exchangeCode(code);


        window.history.replaceState(
            {},
            document.title,
            window.location.pathname
        );


        return token;

    }


    return null;

}


/* =================================================
   API SPOTIFY
================================================= */

async function api(
    url,
    options={}
){

    let token =
    await getToken();


    let response =
    await fetch(
        url,
        {

            ...options,

            headers:{

                ...(options.headers || {}),

                "Authorization":
                "Bearer " + token

            }

        }
    );


    if(response.status === 401){

        token =
        await refreshToken();


        response =
        await fetch(
            url,
            {

                ...options,

                headers:{

                    ...(options.headers || {}),

                    "Authorization":
                    "Bearer " + token

                }

            }
        );

    }


    if(!response.ok){

        throw new Error(
            await response.text()
        );

    }


    if(response.status === 204){

        return null;

    }


    return response.json();

}
