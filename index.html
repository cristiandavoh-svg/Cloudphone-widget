<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240, height=320, initial-scale=1">

<title>Spotify</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #121212;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    padding: 10px;
}

h1 {
    margin: 5px 0 15px 0;
    font-size: 22px;
}

button {
    display: block;
    width: 100%;
    height: 42px;
    margin-bottom: 7px;
    border: 0;
    border-radius: 5px;
    background: #282828;
    color: white;
    font-size: 13px;
    text-align: left;
    padding-left: 12px;
}

button:active {
    background: #1ed760;
    color: black;
}

#message {
    margin-top: 15px;
    color: #999;
    font-size: 10px;
}
</style>
</head>

<body>

<div class="container">

    <h1>♫ SPOTIFY</h1>

    <button onclick="searchMusic()">
        🔎 Buscar
    </button>

    <button onclick="showPlaylists()">
        🎵 Mis playlists
    </button>

    <button onclick="showLiked()">
        ♥ Mis canciones
    </button>

    <button onclick="showPlayer()">
        ▶ Reproducción actual
    </button>

    <div id="message">
        Widget iniciado correctamente
    </div>

</div>

<script>

function searchMusic() {
    document.getElementById("message").innerHTML =
        "Buscar música";
}

function showPlaylists() {
    document.getElementById("message").innerHTML =
        "Mis playlists";
}

function showLiked() {
    document.getElementById("message").innerHTML =
        "Mis canciones";
}

function showPlayer() {
    document.getElementById("message").innerHTML =
        "Reproducción actual";
}

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowDown") {
        document.getElementById("message").innerHTML =
            "↓";
    }

    if (event.key === "ArrowUp") {
        document.getElementById("message").innerHTML =
            "↑";
    }

    if (event.key === "Enter") {
        document.getElementById("message").innerHTML =
            "ENTER";
    }

});

</script>

</body>
</html>
