<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240,height=320,initial-scale=1">
<title>Spotify CloudPhone</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 padding:0;

button{

}

button:active{

.green{

.item:active{

.item-subtitle{

</head>

<body>

<div id="app">

<button id="loginBtn" class="green">

</button>

<button id="searchBtn">
🔎 BUSCAR
</button>

<button id="playlistBtn">

</button>

<button id="likedBtn">

</button>

<button id="currentBtn">
▶ REPRODUCCION ACTUAL
</button>

<button id="logoutBtn">

</button>

</div>


<div id="searchScreen" class="screen">

<div class="logo">🔎 BUSCAR</div>

<input id="searchInput"
type="text"
placeholder="Cancion o artista">

<button id="searchGo" class="green">
BUSCAR
</button>

<div id="searchResults"></div>

<button id="searchBack">
← VOLVER
</button>

</div>


<div id="playlistScreen" class="screen">

<div class="logo" id="playlistTitle">
🎵 PLAYLISTS
</div>

<button id="playlistBack">

</button>

</div>

CANCIONES
</div>

<div id="tracksResults"></div>

<button id="tracksBack">
← VOLVER
</button>

</div>


<div id="playerScreen" class="screen">

<div class="logo">
▶ REPRODUCCION
</div>

<div class="player-title">
Nada reproduciéndose
</div>

<div class="player-artist">
—
</div>

<div class="controls">

<button id="playBtn">▶</button>
<button id="nextBtn">▶</button>

</div>

<button id="refreshPlayer">
🔄 ACTUALIZAR
</button>

<button id="playerBack">
← VOLVER
</button>

</div>


<div id="status">
Widget listo
</div>

</div>


<script>

var CLIENT_ID =
"8b61d543ab204a01986a47f38e419304";

var REDIRECT_URI =
"https://cristiandavoh-svg.github.io/Cloudphone-widget/";

var API =
"https://api.spotify.com/v1";

var SCOPES =
"user-read-private " +
"user-read-email " +
"playlist-read-private " +
"playlist-read-collaborative " +
"user-library-read " +
"user-read-playback-state " +
"user-modify-playback-state";


var home=document.getElementById("home");
var searchScreen=document.getElementById("searchScreen");
var playlistScreen=document.getElementById("playlistScreen");
var tracksScreen=document.getElementById("tracksScreen");
var playerScreen=document.getElementById("playerScreen");
var status=document.getElementById("status");


function setStatus(text){
 status.innerHTML=text;
}


function show(screen){
 home.className="screen";
 searchScreen.className="screen";
 playlistScreen.className="screen";
 tracksScreen.className="screen";
 playerScreen.className="screen";
 screen.className="screen active";
}


function homePage(){
 show(home);
 setStatus("Menu principal");
}


function escapeHTML(text){
 return String(text)
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}


/* TOUCH + CLICK */

function addButton(element,callback){

 var locked=false;

 element.addEventListener(
  "touchend",
  function(e){
   e.preventDefault();

   if(locked)return;

   locked=true;
   callback();

   setTimeout(function(){
    locked=false;
   },350);
  },
  false
 );

 element.addEventListener(
  "click",
  function(){
   if(locked)return;
   callback();
  },
  false
 );
}


/* PKCE */

function randomString(length){

 var chars=
 "ABCDEFGHIJKLMNOPQRSTUVWXYZ"+
 "abcdefghijklmnopqrstuvwxyz"+
 "0123456789";

 var result="";

 var values=
 new Uint8Array(length);

 crypto.getRandomValues(values);

 for(var i=0;i<length;i++){
  result+=chars[values[i]%chars.length];
 }

 return result;
}


function base64url(buffer){

 var bytes=new Uint8Array(buffer);
 var binary="";

 for(var i=0;i<bytes.byteLength;i++){
  binary+=String.fromCharCode(bytes[i]);
 }

 return btoa(binary)
 .replace(/\+/g,"-")
 .replace(/\//g,"_")
 .replace(/=+$/,"");
}


async function createChallenge(verifier){

 var encoder=new TextEncoder();

 var data=encoder.encode(verifier);

 var digest=
 await crypto.subtle.digest(
  "SHA-256",
  data
 );

 return base64url(digest);
}


/* LOGIN */

async function login(){

 try{

  if(!window.crypto || !window.crypto.subtle){

   setStatus(
    "Cloud Phone no soporta PKCE"
   );

   return;
  }

  setStatus("Preparando Spotify...");

  var verifier=randomString(64);

  var challenge=
  await createChallenge(verifier);

  var state=randomString(32);

  localStorage.setItem(
   "spotify_code_verifier",
   verifier
  );

  localStorage.setItem(
   "spotify_state",
   state
  );

  var auth=
  new URL(
   "https://accounts.spotify.com/authorize"
  );

  auth.search=
  new URLSearchParams({

   client_id:CLIENT_ID,

   /* ESTA ES LA LINEA CORREGIDA */
   response_type:"code",

   redirect_uri:REDIRECT_URI,

   scope:SCOPES,

   state:state,

   code_challenge_method:"S256",

   code_challenge:challenge

  });

  window.location.href=auth.toString();

 }

 catch(error){

  console.log(error);

  setStatus(
   "Error iniciando Spotify"
  );

 }
}


/* INTERCAMBIO DEL CODE */

async function exchangeCode(code){

 var verifier=
 localStorage.getItem(
  "spotify_code_verifier"
 );

 if(!verifier){

  setStatus(
   "Falta codigo PKCE"
  );

  return false;
 }

 try{

  setStatus(
   "Conectando con Spotify..."
  );

  var response=
  await fetch(
   "https://accounts.spotify.com/api/token",
   {
    method:"POST",

    headers:{
     "Content-Type":
     "application/x-www-form-urlencoded"
    },

    body:
    new URLSearchParams({

     client_id:CLIENT_ID,

     grant_type:
     "authorization_code",

     code:code,

     redirect_uri:
     REDIRECT_URI,

     code_verifier:
     verifier

    })
   }
  );

  var data=
  await response.json();

  if(!response.ok){

   console.log(data);

   setStatus(
    "Spotify rechazo el login"
   );

   return false;
  }

  localStorage.setItem(
   "spotify_access_token",
   data.access_token
  );

  if(data.refresh_token){

   localStorage.setItem(
    "spotify_refresh_token",
    data.refresh_token
   );
  }

  localStorage.setItem(
   "spotify_expires",
   String(
    Date.now()+
    data.expires_in*1000
   )
  );

  localStorage.removeItem(
   "spotify_code_verifier"
  );

  localStorage.removeItem(
   "spotify_state"
  );

  window.history.replaceState(
   {},
   document.title,
   REDIRECT_URI
  );

  setStatus(
   "Spotify conectado ✓"
  );

  return true;

 }
 catch(error){

  console.log(error);

  setStatus(
   "Error conectando Spotify"
  );

  return false;
 }
}


/* TOKEN */

function getToken(){

 return localStorage.getItem(
  "spotify_access_token"
 );
}


/* API */

async function spotify(url,options){

 var token=getToken();

 if(!token){
  throw new Error("NO_LOGIN");
 }

 options=options||{};
 options.headers=options.headers||{};

 options.headers.Authorization=
 "Bearer "+token;

 var response=
 await fetch(url,options);

 if(response.status===401){

  localStorage.removeItem(
   "spotify_access_token"
  );

  throw new Error(
   "SESSION_EXPIRED"
  );
 }

 if(response.status===204){
  return null;
 }

 var data=
 await response.json();

 if(!response.ok){

  throw new Error(
   data.error?.message||
   "Spotify API error"
  );
 }

 return data;
}


/* SEARCH */

async function searchSpotify(){

 var input=
 document.getElementById(
  "searchInput"
 );

 var query=
 input.value.trim();

 if(!query){

  setStatus(
   "Escribe una cancion"
  );

  return;
 }

 var box=
 document.getElementById(
  "searchResults"
 );

 box.innerHTML=
 "<div class='item'>Buscando...</div>";

 try{

  var data=
  await spotify(
   API+
   "/search?type=track&limit=15&q="+
   encodeURIComponent(query)
  );

  box.innerHTML="";

  data.tracks.items.forEach(
   function(track){

    var item=
    document.createElement("div");

    item.className="item";

    item.innerHTML=
    "<div class='item-title'>"+
    escapeHTML(track.name)+
    "</div>"+
    "<div class='item-subtitle'>"+
    escapeHTML(
     track.artists.map(
      function(a){
       return a.name;
      }
     ).join(", ")
    )+
    "</div>";

    addButton(
     item,
     function(){
      openTrack(track);
     }
    );

    box.appendChild(item);
   }
  );

  setStatus(
   data.tracks.items.length+
   " resultados"
  );

 }
 catch(error){
  handleError(error);
 }
}


function openTrack(track){

 setStatus(
  "Abriendo Spotify..."
 );

 window.location.href=
 "https://open.spotify.com/track/"+
 track.id;
}


/* PLAYLISTS */

async function loadPlaylists(){

 show(playlistScreen);

 var box=
 document.getElementById(
  "playlistResults"
 );

 box.innerHTML=
 "<div class='item'>"+
 "Cargando playlists..."+
 "</div>";

 try{

  var data=
  await spotify(
   API+
   "/me/playlists?limit=50"
  );

  box.innerHTML="";

  data.items.forEach(
   function(playlist){

    var item=
    document.createElement("div");

    item.className="item";

    item.innerHTML=
    "<div class='item-title'>"+
    escapeHTML(playlist.name)+
    "</div>"+
    "<div class='item-subtitle'>"+
    playlist.tracks.total+
    " canciones</div>";

    addButton(
     item,
     function(){
      loadPlaylist(
       playlist.id,
       playlist.name
      );
     }
    );

    box.appendChild(item);

   }
  );

  setStatus(
   "Selecciona una playlist"
  );

 }
 catch(error){
  handleError(error);
 }
}


/* PLAYLIST TRACKS */

async function loadPlaylist(id,name){

 show(tracksScreen);

 document.getElementById(
  "tracksTitle"
 ).innerHTML=
 escapeHTML(name);

 var box=
 document.getElementById(
  "tracksResults"
 );

 box.innerHTML=
 "<div class='item'>Cargando...</div>";

 try{

  var data=
  await spotify(
   API+
   "/playlists/"+
   id+
   "/items?limit=50"
  );

  box.innerHTML="";

  data.items.forEach(
   function(entry){

    var track=entry.item;

    if(!track)return;

    var item=
    document.createElement("div");

    item.className="item";

    item.innerHTML=
    "<div class='item-title'>"+
    escapeHTML(track.name)+
    "</div>"+
    "<div class='item-subtitle'>"+
    escapeHTML(
     track.artists.map(
      function(a){
       return a.name;
      }
     ).join(", ")
    )+
    "</div>";

    addButton(
     item,
     function(){
      openTrack(track);
     }
    );

    box.appendChild(item);
   }
  );

  setStatus(
   "Selecciona una cancion"
  );

 }
 catch(error){
  handleError(error);
 }
}


/* LIKED */

async function loadLiked(){

 show(tracksScreen);

 document.getElementById(
  "tracksTitle"
 ).innerHTML=
 "♥ MIS CANCIONES";

 var box=
 document.getElementById(
  "tracksResults"
 );

 box.innerHTML=
 "<div class='item'>Cargando...</div>";

 try{

  var data=
  await spotify(
   API+
   "/me/library/tracks?limit=50"
  );

  box.innerHTML="";

  data.items.forEach(
   function(entry){

    var track=entry.item;

    var item=
    document.createElement("div");

    item.className="item";

    item.innerHTML=
    "<div class='item-title'>"+
    escapeHTML(track.name)+
    "</div>"+
    "<div class='item-subtitle'>"+
    escapeHTML(
     track.artists.map(
      function(a){
       return a.name;
      }
     ).join(", ")
    )+
    "</div>";

    addButton(
     item,
     function(){
      openTrack(track);
     }
    );

    box.appendChild(item);

   }
  );

  setStatus(
   "Selecciona una cancion"
  );

 }
 catch(error){
  handleError(error);
 }
}


/* CURRENT */

async function loadCurrent(){

 show(playerScreen);

 var info=
 document.getElementById(
  "playerInfo"
 );

 info.innerHTML=
 "<div class='player-title'>"+
 "Cargando..."+
 "</div>";

 try{

  var data=
  await spotify(
   API+
   "/me/player"
  );

  if(!data || !data.item){

   info.innerHTML=
   "<div class='player-title'>"+
   "Nada reproduciendose"+
   "</div>";

   setStatus(
    "No hay reproduccion"
   );

   return;
  }

  var track=data.item;

  info.innerHTML=
  "<div class='player-title'>"+
  escapeHTML(track.name)+
  "</div>"+
  "<div class='player-artist'>"+
  escapeHTML(
   track.artists.map(
    function(a){
     return a.name;
    }
   ).join(", ")
  )+
  "</div>";

  setStatus(
   data.is_playing?
   "Reproduciendo":
   "Pausado"
  );

 }
 catch(error){
  handleError(error);
 }
}


/* PLAY PAUSE */

async function togglePlay(){

 try{

  var data=
  await spotify(
   API+
   "/me/player"
  );

  if(data && data.is_playing){

   await spotify(
    API+
    "/me/player/pause",
    {method:"PUT"}
   );

   setStatus("Pausado");

  }
  else{

   await spotify(
    API+
    "/me/player/play",
    {method:"PUT"}
   );

   setStatus("Reproduciendo");

  }

 }
 catch(error){
  handleError(error);
 }
}


/* NEXT */

async function nextTrack(){

 try{

  await spotify(
   API+
   "/me/player/next",
   {method:"POST"}
  );

  setStatus("Siguiente");

  setTimeout(
   loadCurrent,
   700
  );

 }
 catch(error){
  handleError(error);
 }
}


/* PREVIOUS */

async function previousTrack(){

 try{

  await spotify(
   API+
   "/me/player/previous",
   {method:"POST"}
  );

  setStatus("Anterior");

  setTimeout(
   loadCurrent,
   700
  );

 }
 catch(error){
  handleError(error);
 }
}


/* ERROR */

function handleError(error){

 console.log(error);

 if(error.message==="NO_LOGIN"){

  setStatus(
   "Inicia sesion primero"
  );

  return;
 }

 if(error.message==="SESSION_EXPIRED"){

  setStatus(
   "Sesion caducada"
  );

  return;
 }

 setStatus(
  "Error: "+
  error.message
 );
}


/* LOGOUT */

function logout(){

 localStorage.removeItem(
  "spotify_access_token"
 );

 localStorage.removeItem(
  "spotify_refresh_token"
 );

 localStorage.removeItem(
  "spotify_code_verifier"
 );

 localStorage.removeItem(
  "spotify_state"
 );

 setStatus(
  "Sesion cerrada"
 );
}


/* BOTONES */

addButton(
 document.getElementById("loginBtn"),
 login
);

addButton(
 document.getElementById("searchBtn"),
 function(){

  show(searchScreen);

  setStatus(
   "Busca una cancion"
  );

 }
);

addButton(
 document.getElementById("playlistBtn"),
 loadPlaylists
);

addButton(
 document.getElementById("likedBtn"),
 loadLiked
);

addButton(
 document.getElementById("currentBtn"),
 loadCurrent
);

addButton(
 document.getElementById("logoutBtn"),
 logout
);

addButton(
 document.getElementById("searchGo"),
 searchSpotify
);

addButton(
 document.getElementById("searchBack"),
 homePage
);

addButton(
 document.getElementById("playlistBack"),
 homePage
);

addButton(
 document.getElementById("tracksBack"),
 homePage
);

addButton(
 document.getElementById("playerBack"),
 homePage
);

addButton(
 document.getElementById("refreshPlayer"),
 loadCurrent
);

addButton(
 document.getElementById("playBtn"),
 togglePlay
);

addButton(
 document.getElementById("nextBtn"),
 nextTrack
);

addButton(
 document.getElementById("previousBtn"),
 previousTrack
);


/* TECLADO */

document.addEventListener(
 "keydown",
 function(event){

  if(
   event.key==="Escape" ||
   event.key==="ArrowLeft"
  ){
   homePage();
  }

 }
);


/* CALLBACK */

async function processCallback(){

 var params=
 new URLSearchParams(
  window.location.search
 );

 var code=
 params.get("code");

 var error=
 params.get("error");

 if(error){

  setStatus(
   "Spotify: "+error
  );

  return;
 }

 if(!code){
  return;
 }

 var savedState=
 localStorage.getItem(
  "spotify_state"
 );

 var returnedState=
 params.get("state");

 if(
  savedState &&
  returnedState!==savedState
 ){

  setStatus(
   "Error de seguridad"
  );

  return;
 }

 await exchangeCode(code);
}


processCallback();

</script>

</body>
</html>
