<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240,height=320,initial-scale=1">

<title>Spotify</title>

<style>
html,body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#101010;
    color:#ffffff;
    font-family:Arial,sans-serif;
}

#app {
    width:240px;
    min-height:320px;
    padding:10px;
    box-sizing:border-box;
}

h1 {
    font-size:20px;
    margin:2px 0 12px 0;
}

button {
    display:block;
    width:100%;
    height:42px;
    margin:6px 0;
    padding:0 10px;

    border:0;
    border-radius:5px;

    background:#282828;
    color:#ffffff;

    font-size:12px;
    text-align:left;
}

button:active {
    background:#1db954;
    color:#000000;
}

.green {
    background:#1db954;
    color:#000000;
    font-weight:bold;
}

.screen {
    display:none;
}

.screen.active {
    display:block;
}

.item {
    width:100%;
    min-height:40px;
    margin:4px 0;
    padding:7px;
    box-sizing:border-box;

    background:#1c1c1c;
    border-radius:4px;

    font-size:10px;
}

.item:active {
    background:#333333;
}

.title {
    font-size:13px;
    font-weight:bold;
}

.subtitle {
    margin-top:3px;
    color:#999999;
    font-size:9px;
}

input {
    width:100%;
    height:38px;
    box-sizing:border-box;

    border:0;
    border-radius:5px;

    background:#282828;
    color:white;

    padding:8px;
    font-size:11px;
}

#status {
    margin-top:10px;
    color:#888888;
    font-size:9px;
}

</style>
</head>

<body>

<div id="app">

    <!-- INICIO -->

    <div id="home" class="screen active">

        <h1>♫ SPOTIFY</h1>

        <button id="login" class="green">
            INICIAR SESION
        </button>

        <button id="search">
            BUSCAR
        </button>

        <button id="playlists">
            MIS PLAYLISTS
        </button>

        <button id="liked">
            MIS CANCIONES
        </button>

        <button id="current">
            REPRODUCCION ACTUAL
        </button>

    </div>


    <!-- BUSQUEDA -->

    <div id="searchScreen" class="screen">

        <h1>BUSCAR</h1>

        <input
            id="searchInput"
            type="text"
            placeholder="Cancion o artista">

        <button id="searchGo" class="green">
            BUSCAR
        </button>

        <div id="results"></div>

        <button id="backSearch">
            VOLVER
        </button>

    </div>


    <!-- LISTAS -->

    <div id="listScreen" class="screen">

        <h1 id="listTitle">
            PLAYLISTS
        </h1>

        <div id="list"></div>

        <button id="backList">
            VOLVER
        </button>

    </div>


    <div id="status">
        Widget iniciado
    </div>

</div>


<script>

/*
====================================================
 CONFIGURACION
====================================================
*/

var CLIENT_ID =
"8b61d543ab204a01986a47f38e419304";


/*
IMPORTANTE:

Usamos la pagina principal como Redirect URI.
NO /callback.

En Spotify Developer Dashboard debes registrar:

https://cristiandavoh-svg.github.io/Cloudphone-widget/
*/

var REDIRECT_URI =
"https://cristiandavoh-svg.github.io/Cloudphone-widget/";


var API =
"https://api.spotify.com/v1";


/*
====================================================
 ELEMENTOS
====================================================
*/

var home =
document.getElementById("home");

var searchScreen =
document.getElementById("searchScreen");

var listScreen =
document.getElementById("listScreen");

var status =
document.getElementById("status");

var results =
document.getElementById("results");

var list =
document.getElementById("list");

var searchInput =
document.getElementById("searchInput");


/*
====================================================
 NAVEGACION
====================================================
*/

function show(screen) {

    home.className = "screen";
    searchScreen.className = "screen";
    listScreen.className = "screen";

    screen.className =
        "screen active";
}


function goHome() {

    show(home);

    status.innerHTML =
        "Menu principal";

}


/*
====================================================
 EVENTOS TACTILES
====================================================

Usamos TOUCHEND + CLICK.
Si uno no funciona en Cloud Phone,
el otro normalmente si.
*/

function press(element, action) {

    var done = false;

    element.addEventListener(
        "touchend",
        function(e) {

            e.preventDefault();

            if(done) return;

            done = true;

            action();

            setTimeout(
                function() {
                    done = false;
                },
                400
            );

        },
        false
    );


    element.addEventListener(
        "click",
        function() {

            if(done) return;

            action();

        },
        false
    );

}


/*
====================================================
 BOTONES
====================================================
*/

press(
    document.getElementById("search"),
    function() {

        show(searchScreen);

        status.innerHTML =
            "Escribe una busqueda";

        setTimeout(
            function() {
                searchInput.focus();
            },
            100
        );

    }
);


press(
    document.getElementById("playlists"),
    function() {

        show(listScreen);

        document.getElementById(
            "listTitle"
        ).innerHTML =
            "MIS PLAYLISTS";

        list.innerHTML =
            "<div class='item'>" +
            "<div class='title'>PLAYLISTS</div>" +
            "<div class='subtitle'>" +
            "Inicia sesion para cargarlas" +
            "</div>" +
            "</div>";

        status.innerHTML =
            "Seccion de playlists";

    }
);


press(
    document.getElementById("liked"),
    function() {

        show(listScreen);

        document.getElementById(
            "listTitle"
        ).innerHTML =
            "MIS CANCIONES";

        list.innerHTML =
            "<div class='item'>" +
            "<div class='title'>MIS CANCIONES</div>" +
            "<div class='subtitle'>" +
            "Inicia sesion para cargarlas" +
            "</div>" +
            "</div>";

        status.innerHTML =
            "Seccion de canciones";

    }
);


press(
    document.getElementById("current"),
    function() {

        show(listScreen);

        document.getElementById(
            "listTitle"
        ).innerHTML =
            "REPRODUCCION";

        list.innerHTML =
            "<div class='item'>" +
            "<div class='title'>" +
            "REPRODUCCION ACTUAL" +
            "</div>" +
            "<div class='subtitle'>" +
            "Todavia no hay reproduccion" +
            "</div>" +
            "</div>";

        status.innerHTML =
            "Reproductor";

    }
);


press(
    document.getElementById("backSearch"),
    goHome
);


press(
    document.getElementById("backList"),
    goHome
);


/*
====================================================
 LOGIN SPOTIFY
====================================================
*/

press(
    document.getElementById("login"),
    function() {

        status.innerHTML =
            "Abriendo Spotify...";


        var scopes =
            "user-read-private " +
            "user-read-email " +
            "playlist-read-private " +
            "playlist-read-collaborative " +
            "user-library-read " +
            "user-read-playback-state";


        var url =
            "https://accounts.spotify.com/authorize" +
            "?client_id=" +
            encodeURIComponent(CLIENT_ID) +
            "&response_type=token" +
            "&redirect_uri=" +
            encodeURIComponent(REDIRECT_URI) +
            "&scope=" +
            encodeURIComponent(scopes);


        window.location.href = url;

    }
);


/*
====================================================
 BUSQUEDA
====================================================
*/

press(
    document.getElementById("searchGo"),
    function() {

        var query =
            searchInput.value;


        if(!query) {

            status.innerHTML =
                "Escribe algo primero";

            return;

        }


        var token =
            localStorage.getItem(
                "spotify_token"
            );


        if(!token) {

            status.innerHTML =
                "Primero inicia sesion";

            return;

        }


        status.innerHTML =
            "Buscando...";


        fetch(
            API +
            "/search?type=track&limit=10&q=" +
            encodeURIComponent(query),
            {

                headers: {
                    "Authorization":
                    "Bearer " + token
                }

            }
        )
        .then(
            function(response) {

                return response.json();

            }
        )
        .then(
            function(data) {

                results.innerHTML = "";


                if(
                    !data.tracks ||
                    !data.tracks.items.length
                ) {

                    results.innerHTML =
                        "<div class='item'>" +
                        "No se encontraron canciones" +
                        "</div>";

                    return;

                }


                data.tracks.items.forEach(
                    function(track) {

                        var item =
                            document.createElement(
                                "div"
                            );


                        item.className =
                            "item";


                        item.innerHTML =
                            "<div class='title'>" +
                            escapeText(
                                track.name
                            ) +
                            "</div>" +

                            "<div class='subtitle'>" +
                            escapeText(
                                track.artists
                                    .map(
                                        function(a) {
                                            return a.name;
                                        }
                                    )
                                    .join(", ")
                            ) +
                            "</div>";


                        press(
                            item,
                            function() {

                                openSpotify(
                                    track
                                );

                            }
                        );


                        results.appendChild(
                            item
                        );

                    }
                );


                status.innerHTML =
                    "Toca una cancion";

            }
        )
        .catch(
            function(error) {

                status.innerHTML =
                    "Error de conexion";

                console.log(error);

            }
        );

    }
);


/*
====================================================
 ABRIR CANCION
====================================================
*/

function openSpotify(track) {

    status.innerHTML =
        "Abriendo Spotify...";


    /*
    Usamos URL web en lugar de
    spotify:track: porque Cloud Phone
    puede no soportar esquemas externos.
    */

    window.location.href =
        "https://open.spotify.com/track/" +
        track.id;

}


/*
====================================================
 TOKEN
====================================================
*/

function checkLogin() {

    var hash =
        window.location.hash;


    if(!hash) {

        return;

    }


    var data =
        new URLSearchParams(
            hash.substring(1)
        );


    var token =
        data.get("access_token");


    if(token) {

        localStorage.setItem(
            "spotify_token",
            token
        );


        window.history.replaceState(
            {},
            document.title,
            window.location.pathname
        );


        status.innerHTML =
            "Spotify conectado";

    }

}


/*
====================================================
 TEXTO SEGURO
====================================================
*/

function escapeText(text) {

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");

}


/*
====================================================
 TECLADO NOKIA
====================================================
*/

document.addEventListener(
    "keydown",
    function(event) {

        if(
            event.key === "Escape" ||
            event.key === "ArrowLeft"
        ) {

            goHome();

        }

    }
);


/*
====================================================
 INICIO
====================================================
*/

checkLogin();

</script>

</body>
</html>
