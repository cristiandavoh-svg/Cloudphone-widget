<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240,height=320,initial-scale=1">
<title>Spotify</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 240px;
    height: 320px;
    overflow: hidden;
    background: #121212;
    color: white;
    font-family: Arial, sans-serif;
}

body {
    user-select: none;
}

.screen {
    width: 240px;
    height: 320px;
    padding: 10px;
}

/* LOGIN */

#loginScreen {
    text-align: center;
    padding-top: 55px;
}

.logo {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 8px;
}

.subtitle {
    color: #b3b3b3;
    font-size: 11px;
    margin-bottom: 30px;
}

.loginButton {
    border: 0;
    background: #1ed760;
    color: #000;
    border-radius: 18px;
    padding: 8px 22px;
    font-weight: bold;
    font-size: 13px;
}

/* PLAYER */

#playerScreen {
    display: none;
}

.top {
    height: 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.topTitle {
    font-size: 11px;
    color: #b3b3b3;
}

.cover {
    width: 145px;
    height: 145px;
    margin: 10px auto 12px;
    background: #282828;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.coverIcon {
    font-size: 45px;
    color: #777;
}

.song {
    font-size: 15px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.artist {
    color: #b3b3b3;
    font-size: 11px;
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.progress {
    margin-top: 14px;
}

.bar {
    height: 3px;
    background: #555;
    width: 100%;
}

.barProgress {
    height: 3px;
    background: #fff;
    width: 0%;
}

.time {
    display: flex;
    justify-content: space-between;
    font-size: 8px;
    color: #aaa;
    margin-top: 3px;
}

.controls {
    margin-top: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 19px;
}

.control {
    font-size: 18px;
    color: white;
}

.play {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: white;
    color: black;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
}

.status {
    position: absolute;
    bottom: 5px;
    left: 0;
    width: 240px;
    text-align: center;
    color: #777;
    font-size: 8px;
}

/* SEARCH */

#searchScreen {
    display: none;
}

.searchTitle {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

.searchBox {
    height: 25px;
    background: #282828;
    padding: 5px;
    color: white;
    font-size: 11px;
}

.result {
    margin-top: 5px;
    padding: 5px;
    height: 32px;
    background: #181818;
}

.resultSelected {
    background: #333;
}

.resultName {
    font-size: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.resultArtist {
    font-size: 8px;
    color: #aaa;
}

.help {
    position: absolute;
    bottom: 17px;
    left: 0;
    width: 240px;
    text-align: center;
    font-size: 8px;
    color: #777;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="screen">

    <div class="logo">♫</div>

    <div class="subtitle">
        SPOTIFY CLOUD PLAYER
    </div>

    <button class="loginButton" id="loginButton">
        INICIAR SESIÓN
    </button>

    <div class="status" id="loginStatus">
        Cloud Phone
    </div>

</div>


<!-- PLAYER -->
<div id="playerScreen" class="screen">

    <div class="top">
        <div class="topTitle">NOW PLAYING</div>
        <div>♫</div>
    </div>

    <div class="cover" id="cover">
        <div class="coverIcon">♪</div>
    </div>

    <div class="song" id="song">
        No hay canción
    </div>

    <div class="artist" id="artist">
        Spotify
    </div>

    <div class="progress">
        <div class="bar">
            <div class="barProgress" id="barProgress"></div>
        </div>

        <div class="time">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>
    </div>

    <div class="controls">

        <div class="control" id="previous">
            ◀◀
        </div>

        <div class="play" id="play">
            ▶
        </div>

        <div class="control" id="next">
            ▶▶
        </div>

    </div>

    <div class="status" id="status">
        Conectando...
    </div>

</div>


<script src="https://sdk.scdn.co/spotify-player.js"></script>

<script>

/* CONFIGURACIÓN */

const CLIENT_ID =
"8b61d543ab204a01986a47f38e419304";

/* ESTA ES LA LÍNEA CORREGIDA */

const REDIRECT_URI =
"https://cristiandavoh-svg.github.io/Cloudphone-widget/";

const SCOPES =
[
    "streaming",
    "user-read-email",
    "user-read-private",
    "user-read-playback-state",
    "user-modify-playback-state"
].join(" ");


/* ELEMENTOS */

const loginScreen =
document.getElementById("loginScreen");

const playerScreen =
document.getElementById("playerScreen");

const loginButton =
document.getElementById("loginButton");

const loginStatus =
document.getElementById("loginStatus");

const status =
document.getElementById("status");

const song =
document.getElementById("song");

const artist =
document.getElementById("artist");

const cover =
document.getElementById("cover");

const playButton =
document.getElementById("play");

const previousButton =
document.getElementById("previous");

const nextButton =
document.getElementById("next");

const barProgress =
document.getElementById("barProgress");

const currentTime =
document.getElementById("currentTime");

const duration =
document.getElementById("duration");


let player = null;
let deviceId = null;
let currentState = null;


/* PKCE */

function randomString(length) {

    const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

    const values =
    crypto.getRandomValues(
        new Uint8Array(length)
    );

    let result = "";

    for (let i = 0; i < length; i++) {
        result += chars[values[i] % chars.length];
    }

    return result;
}


async function sha256(value) {

    const data =
    new TextEncoder().encode(value);

    return crypto.subtle.digest(
        "SHA-256",
        data
    );
}


function base64url(buffer) {

    let string = "";

    const bytes =
    new Uint8Array(buffer);

    for (const byte of bytes) {
        string += String.fromCharCode(byte);
    }

    return btoa(string)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
}


/* LOGIN */

async function login() {

    try {

        loginStatus.textContent =
        "Abriendo Spotify...";

        const verifier =
        randomString(64);

        const challenge =
        base64url(
            await sha256(verifier)
        );

        localStorage.setItem(
            "spotify_verifier",
            verifier
        );

        const state =
        randomString(32);

        localStorage.setItem(
            "spotify_state",
            state
        );

        const params =
        new URLSearchParams({

            client_id: CLIENT_ID,

            response_type: "code",

            redirect_uri: REDIRECT_URI,

            scope: SCOPES,

            state: state,

            code_challenge_method: "S256",

            code_challenge: challenge

        });

        window.location.href =
        "https://accounts.spotify.com/authorize?" +
        params.toString();

    } catch (error) {

        console.error(error);

        loginStatus.textContent =
        "ERROR AL ABRIR";

    }
}


loginButton.addEventListener(
    "click",
    login
);


/* INTERCAMBIAR CÓDIGO POR TOKEN */

async function exchangeCode(code) {

    const verifier =
    localStorage.getItem(
        "spotify_verifier"
    );

    const response =
    await fetch(
        "https://accounts.spotify.com/api/token",
        {
            method: "POST",

            headers: {
                "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body:
            new URLSearchParams({

                client_id: CLIENT_ID,

                grant_type:
                "authorization_code",

                code: code,

                redirect_uri:
                REDIRECT_URI,

                code_verifier:
                verifier

            })
        }
    );

    const data =
    await response.json();

    if (!response.ok) {

        throw new Error(
            data.error_description ||
            "Token error"
        );

    }

    localStorage.setItem(
        "spotify_access_token",
        data.access_token
    );

    if (data.refresh_token) {

        localStorage.setItem(
            "spotify_refresh_token",
            data.refresh_token
        );

    }

    return data.access_token;
}


/* REFRESH TOKEN */

async function refreshToken() {

    const refresh =
    localStorage.getItem(
        "spotify_refresh_token"
    );

    if (!refresh) {

        throw new Error(
            "No refresh token"
        );

    }

    const response =
    await fetch(
        "https://accounts.spotify.com/api/token",
        {
            method: "POST",

            headers: {
                "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body:
            new URLSearchParams({

                client_id:
                CLIENT_ID,

                grant_type:
                "refresh_token",

                refresh_token:
                refresh

            })
        }
    );

    const data =
    await response.json();

    if (!response.ok) {
        throw new Error("Refresh failed");
    }

    localStorage.setItem(
        "spotify_access_token",
        data.access_token
    );

    return data.access_token;
}


/* OBTENER TOKEN */

async function getToken() {

    const token =
    localStorage.getItem(
        "spotify_access_token"
    );

    if (token) return token;

    return null;
}


/* PROCESAR EL REGRESO DE SPOTIFY */

async function handleCallback() {

    const params =
    new URLSearchParams(
        window.location.search
    );

    const code =
    params.get("code");

    const returnedState =
    params.get("state");

    const savedState =
    localStorage.getItem(
        "spotify_state"
    );

    if (!code) return false;

    if (
        !returnedState ||
        returnedState !== savedState
    ) {

        loginStatus.textContent =
        "ERROR DE SEGURIDAD";

        return false;
    }

    try {

        loginStatus.textContent =
        "Conectando...";

        await exchangeCode(code);

        window.history.replaceState(
            {},
            document.title,
            window.location.pathname
        );

        return true;

    } catch (error) {

        console.error(error);

        loginStatus.textContent =
        "ERROR AL CONECTAR";

        return false;
    }
}


/* SPOTIFY PLAYER */

window.onSpotifyWebPlaybackSDKReady =
async function() {

    await handleCallback();

    const token =
    await getToken();

    if (!token) {
        return;
    }

    loginScreen.style.display =
    "none";

    playerScreen.style.display =
    "block";

    player =
    new Spotify.Player({

        name:
        "Nokia Cloud Music",

        volume:
        0.7,

        getOAuthToken:
        callback => {

            callback(
                localStorage.getItem(
                    "spotify_access_token"
                )
            );

        }

    });


    player.addListener(
        "ready",
        async ({ device_id }) => {

            deviceId =
            device_id;

            status.textContent =
            "LISTO";

            await transferPlayback();

        }
    );


    player.addListener(
        "player_state_changed",
        state => {

            if (!state) return;

            currentState =
            state;

            const track =
            state.track_window
                .current_track;

            song.textContent =
            track.name;

            artist.textContent =
            track.artists
                .map(a => a.name)
                .join(", ");

            const image =
            track.album?.images?.length
            ? track.album.images[
                track.album.images.length - 1
            ].url
            : null;

            if (image) {

                cover.innerHTML =
                `<img src="${image}">`;

            }

            playButton.textContent =
            state.paused
            ? "▶"
            : "Ⅱ";

            updateProgress();

        }
    );


    player.addListener(
        "initialization_error",
        ({ message }) => {

            status.textContent =
            "NAVEGADOR NO COMPATIBLE";

            console.error(message);

        }
    );


    player.addListener(
        "authentication_error",
        ({ message }) => {

            status.textContent =
            "ERROR DE LOGIN";

            console.error(message);

        }
    );


    player.addListener(
        "account_error",
        ({ message }) => {

            status.textContent =
            "REQUIERE PREMIUM";

            console.error(message);

        }
    );


    player.addListener(
        "playback_error",
        ({ message }) => {

            status.textContent =
            "ERROR DE REPRODUCCIÓN";

            console.error(message);

        }
    );


    player.addListener(
        "autoplay_failed",
        () => {

            status.textContent =
            "PULSA PLAY";

        }
    );


    const connected =
    await player.connect();

    if (!connected) {

        status.textContent =
        "NO SE PUDO CONECTAR";

    }

};


/* TRANSFERIR A NUESTRO REPRODUCTOR */

async function transferPlayback() {

    if (!deviceId) return;

    const token =
    await getToken();

    try {

        await fetch(
            "https://api.spotify.com/v1/me/player",
            {
                method: "PUT",

                headers: {

                    "Authorization":
                    "Bearer " + token,

                    "Content-Type":
                    "application/json"

                },

                body:
                JSON.stringify({

                    device_ids:
                    [deviceId],

                    play: false

                })

            }
        );

    } catch (error) {

        console.error(error);

    }
}


/* CONTROLES */

playButton.addEventListener(
    "click",
    async () => {

        if (!player) return;

        try {

            await player.activateElement();

            await player.togglePlay();

        } catch (error) {

            console.error(error);

            status.textContent =
            "NO SE PUEDE REPRODUCIR";

        }

    }
);


nextButton.addEventListener(
    "click",
    async () => {

        if (player) {
            await player.nextTrack();
        }

    }
);


previousButton.addEventListener(
    "click",
    async () => {

        if (player) {
            await player.previousTrack();
        }

    }
);


/* PROGRESO */

function formatTime(milliseconds) {

    const seconds =
    Math.floor(milliseconds / 1000);

    const minutes =
    Math.floor(seconds / 60);

    const remaining =
    seconds % 60;

    return (
        minutes +
        ":" +
        String(remaining).padStart(2, "0")
    );

}


function updateProgress() {

    if (!currentState) return;

    const position =
    currentState.position;

    const total =
    currentState.duration;

    currentTime.textContent =
    formatTime(position);

    duration.textContent =
    formatTime(total);

    if (total > 0) {

        barProgress.style.width =
        (
            position / total * 100
        ) + "%";

    }

}


/* TECLADO DEL NOKIA */

document.addEventListener(
    "keydown",
    async event => {

        if (!player) return;

        if (
            event.key === "Enter" ||
            event.key === "5"
        ) {

            event.preventDefault();

            await player.activateElement();

            await player.togglePlay();

        }

        if (
            event.key === "ArrowRight"
        ) {

            await player.nextTrack();

        }

        if (
            event.key === "ArrowLeft"
        ) {

            await player.previousTrack();

        }

    }
);

</script>

</body>
</html>
