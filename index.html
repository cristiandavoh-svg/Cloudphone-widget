<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240,height=320,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Spotify CloudPhone</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
 margin:0;
 padding:0;
 width:100%;
 min-height:100%;
 background:#121212;
 color:white;
 font-family:Arial,sans-serif;
}
body{overflow-x:hidden}
#app{
 width:240px;
 min-height:320px;
 padding:8px;
 margin:auto;
}
.screen{display:none}
.screen.active{display:block}
.logo{
 font-size:18px;
 font-weight:bold;
 margin:4px 0 10px;
}
button{
 width:100%;
 min-height:36px;
 margin:4px 0;
 padding:7px 9px;
 border:0;
 border-radius:5px;
 background:#282828;
 color:white;
 font-size:10px;
 text-align:left;
 cursor:pointer;
}
button:active{background:#1db954;color:#000}
.green{background:#1db954;color:#000;font-weight:bold}
input{
 width:100%;
 height:34px;
 padding:7px;
 border:0;
 border-radius:5px;
 background:#282828;
 color:white;
 font-size:10px;
}
.list{
 max-height:230px;
 overflow-y:auto;
}
.item{
 width:100%;
 min-height:40px;
 margin:4px 0;
 padding:7px;
 border-radius:5px;
 background:#1d1d1d;
 cursor:pointer;
}
.item:active{background:#333}
.item-title{
 font-size:10px;
 font-weight:bold;
}
.item-subtitle{
 margin-top:3px;
 color:#999;
 font-size:8px;
}
#status{
 margin-top:6px;
 color:#999;
 font-size:8px;
 min-height:14px;
}
.controls{
 display:flex;
 gap:4px;
}
.controls button{
 text-align:center;
 font-size:16px;
}
.player{
 text-align:center;
 padding:12px 0;
}
.player-title{
 font-size:13px;
 font-weight:bold;
}
.player-artist{
 margin-top:5px;
 color:#aaa;
 font-size:9px;
}
.empty{
 color:#999;
 font-size:10px;
 padding:10px 0;
 text-align:center;
}
</style>
</head>

<body>

<div id="app">

<!-- HOME -->
<div id="home" class="screen active">
  <div class="logo">♫ SPOTIFY</div>

  <button id="loginBtn" class="green">INICIAR SESION</button>
  <button id="searchBtn">BUSCAR</button>
  <button id="playlistBtn">MIS PLAYLISTS</button>
  <button id="likedBtn">MIS CANCIONES GUARDADAS</button>
  <button id="currentBtn">REPRODUCCION ACTUAL</button>
  <button id="logoutBtn">CERRAR SESION</button>
</div>

<!-- SEARCH -->
<div id="searchScreen" class="screen">
  <div class="logo">BUSCAR</div>

  <input id="searchInput" type="text" placeholder="Cancion o artista">

  <button id="searchGo" class="green">BUSCAR</button>

  <div id="searchResults" class="list"></div>

  <button id="searchBack">VOLVER</button>
</div>

<!-- PLAYLISTS -->
<div id="playlistScreen" class="screen">
  <div class="logo">MIS PLAYLISTS</div>

  <div id="playlistResults" class="list"></div>

  <button id="playlistBack">VOLVER</button>
</div>

<!-- TRACKS -->
<div id="tracksScreen" class="screen">
  <div class="logo" id="tracksTitle">CANCIONES</div>

  <div id="tracksResults" class="list"></div>

  <button id="tracksBack">VOLVER</button>
</div>

<!-- PLAYER -->
<div id="playerScreen" class="screen">
  <div class="logo">REPRODUCCION</div>

  <div id="playerInfo" class="player">
    <div class="player-title">Nada reproduciéndose</div>
    <div class="player-artist">—</div>
  </div>

  <div class="controls">
    <button id="previousBtn">◀</button>
    <button id="playBtn">▶</button>
    <button id="nextBtn">▶▶</button>
  </div>

  <button id="refreshPlayer">ACTUALIZAR</button>
  <button id="playerBack">VOLVER</button>
</div>

<div id="status">Widget listo</div>

</div>

<script>

/* ================= CONFIGURACION ================= */

var CLIENT_ID = "8b61d543ab204a01986a47f38e419304";

var REDIRECT_URI =
"https://cristiandavoh-svg.github.io/Cloudphone-widget/";

var API = "https://api.spotify.com/v1";

var SCOPES =
"user-read-private " +
"user-read-email " +
"playlist-read-private " +
"playlist-read-collaborative " +
"user-library-read " +
"user-read-playback-state " +
"user-read-currently-playing " +
"user-modify-playback-state";


/* ================= ELEMENTOS ================= */

var home = document.getElementById("home");
var searchScreen = document.getElementById("searchScreen");
var playlistScreen = document.getElementById("playlistScreen");
var tracksScreen = document.getElementById("tracksScreen");
var playerScreen = document.getElementById("playerScreen");
var status = document.getElementById("status");


/* ================= UTILIDADES ================= */

function setStatus(text){
  status.textContent = text;
}

function show(screen){
  home.className = "screen";
  searchScreen.className = "screen";
  playlistScreen.className = "screen";
  tracksScreen.className = "screen";
  playerScreen.className = "screen";

  screen.className = "screen active";
}

function homePage(){
  show(home);
  setStatus("Menu principal");
}

function escapeHTML(text){
  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function addButton(element,callback){
  element.addEventListener("click",callback,false);

  element.addEventListener("touchend",function(e){
    e.preventDefault();
    callback();
  },false);
}


/* ================= PKCE ================= */

function randomString(length){
  var chars =
  "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  var result = "";
  var values = new Uint8Array(length);

  crypto.getRandomValues(values);

  for(var i=0;i<length;i++){
    result += chars[values[i] % chars.length];
  }

  return result;
}

function base64url(buffer){
  var bytes = new Uint8Array(buffer);
  var binary = "";

  for(var i=0;i<bytes.byteLength;i++){
    binary += String.fromCharCode(bytes[i]);
  }

  return btoa(binary)
    .replace(/\+/g,"-")
    .replace(/\//g,"_")
    .replace(/=+$/,"");
}

async function createChallenge(verifier){
  var encoder = new TextEncoder();
  var data = encoder.encode(verifier);

  var digest = await crypto.subtle.digest(
    "SHA-256",
    data
  );

  return base64url(digest);
}


/* ================= LOGIN ================= */

async function login(){

  try{

    if(!window.crypto || !window.crypto.subtle){
      setStatus("Este navegador no soporta PKCE");
      return;
    }

    setStatus("Preparando Spotify...");

    var verifier = randomString(64);
    var challenge = await createChallenge(verifier);
    var state = randomString(32);

    localStorage.setItem(
      "spotify_code_verifier",
      verifier
    );

    localStorage.setItem(
      "spotify_state",
      state
    );

    var auth = new URL(
      "https://accounts.spotify.com/authorize"
    );

    auth.search = new URLSearchParams({
      client_id: CLIENT_ID,
      response_type: "code",
      redirect_uri: REDIRECT_URI,
      scope: SCOPES,
      state: state,
      code_challenge_method: "S256",
      code_challenge: challenge
    });

    window.location.href = auth.toString();

  }catch(error){
    console.log(error);
    setStatus("Error iniciando Spotify");
  }
}


/* ================= CALLBACK ================= */

async function processCallback(){

  var params = new URLSearchParams(
    window.location.search
  );

  var error = params.get("error");
  var code = params.get("code");

  if(error){
    setStatus("Spotify: " + error);
    return;
  }

  if(!code){
    return;
  }

  var savedState = localStorage.getItem(
    "spotify_state"
  );

  var returnedState = params.get("state");

  if(savedState && returnedState !== savedState){
    setStatus("Error de seguridad");
    return;
  }

  var verifier = localStorage.getItem(
    "spotify_code_verifier"
  );

  if(!verifier){
    setStatus("No se encontró el verificador PKCE");
    return;
  }

  try{

    setStatus("Conectando con Spotify...");

    var response = await fetch(
      "https://accounts.spotify.com/api/token",
      {
        method:"POST",
        headers:{
          "Content-Type":
          "application/x-www-form-urlencoded"
        },
        body:new URLSearchParams({
          client_id:CLIENT_ID,
          grant_type:"authorization_code",
          code:code,
          redirect_uri:REDIRECT_URI,
          code_verifier:verifier
        })
      }
    );

    var data = await response.json();

    if(!response.ok){
      console.log(data);
      setStatus("Spotify rechazó el login");
      return;
    }

    localStorage.setItem(
      "spotify_access_token",
      data.access_token
    );

    if(data.refresh_token){
      localStorage.setItem(
        "spotify_refresh_token",
        data.refresh_token
      );
    }

    localStorage.setItem(
      "spotify_expires",
      String(
        Date.now() + data.expires_in * 1000
      )
    );

    localStorage.removeItem("spotify_code_verifier");
    localStorage.removeItem("spotify_state");

    window.history.replaceState(
      {},
      document.title,
      REDIRECT_URI
    );

    setStatus("Spotify conectado ✓");

  }catch(error){
    console.log(error);
    setStatus("Error conectando Spotify");
  }
}


/* ================= TOKEN ================= */

function getToken(){
  return localStorage.getItem(
    "spotify_access_token"
  );
}


/* ================= API ================= */

async function spotify(url,options){

  var token = getToken();

  if(!token){
    throw new Error("NO_LOGIN");
  }

  options = options || {};
  options.headers = options.headers || {};

  options.headers.Authorization =
  "Bearer " + token;

  var response = await fetch(
    url,
    options
  );

  if(response.status === 401){
    localStorage.removeItem(
      "spotify_access_token"
    );
    throw new Error("SESSION_EXPIRED");
  }

  if(response.status === 204){
    return null;
  }

  var data;

  try{
    data = await response.json();
  }catch(e){
    data = {};
  }

  if(!response.ok){
    console.log(data);
    throw new Error(
      data.error && data.error.message ?
      data.error.message :
      "Error de Spotify"
    );
  }

  return data;
}


/* ================= PLAYLISTS ================= */

async function loadPlaylists(){

  show(playlistScreen);

  var box = document.getElementById(
    "playlistResults"
  );

  box.innerHTML =
  "<div class='empty'>Cargando playlists...</div>";

  try{

    var data = await spotify(
      API + "/me/playlists?limit=50"
    );

    box.innerHTML = "";

    if(!data.items || data.items.length === 0){
      box.innerHTML =
      "<div class='empty'>No se encontraron playlists</div>";

      setStatus("0 playlists");
      return;
    }

    data.items.forEach(function(playlist){

      var item = document.createElement("div");
      item.className = "item";

      var total = 0;

      if(playlist.items &&
         typeof playlist.items.total !== "undefined"){
        total = playlist.items.total;
      }else if(playlist.tracks &&
               typeof playlist.tracks.total !== "undefined"){
        total = playlist.tracks.total;
      }

      item.innerHTML =
      "<div class='item-title'>" +
      escapeHTML(playlist.name) +
      "</div>" +
      "<div class='item-subtitle'>" +
      total + " canciones" +
      "</div>";

      addButton(item,function(){
        loadPlaylist(
          playlist.id,
          playlist.name
        );
      });

      box.appendChild(item);
    });

    setStatus(
      data.items.length +
      " playlists cargadas"
    );

  }catch(error){
    handleError(error);
  }
}


/* ================= CANCIONES DE PLAYLIST ================= */

async function loadPlaylist(id,name){

  show(tracksScreen);

  document.getElementById(
    "tracksTitle"
  ).textContent = name;

  var box = document.getElementById(
    "tracksResults"
  );

  box.innerHTML =
  "<div class='empty'>Cargando canciones...</div>";

  try{

    var data = await spotify(
      API +
      "/playlists/" +
      encodeURIComponent(id) +
      "/items?limit=50"
    );

    box.innerHTML = "";

    var count = 0;

    data.items.forEach(function(entry){

      var track = entry.item;

      if(!track || track.type !== "track"){
        return;
      }

      count++;

      var item = document.createElement("div");
      item.className = "item";

      item.innerHTML =
      "<div class='item-title'>" +
      escapeHTML(track.name) +
      "</div>" +
      "<div class='item-subtitle'>" +
      escapeHTML(
        (track.artists || []).map(function(a){
          return a.name;
        }).join(", ")
      ) +
      "</div>";

      addButton(item,function(){
        openTrack(track);
      });

      box.appendChild(item);
    });

    if(count === 0){
      box.innerHTML =
      "<div class='empty'>Esta playlist está vacía</div>";
    }

    setStatus(count + " canciones");

  }catch(error){
    handleError(error);
  }
}


/* ================= CANCIONES GUARDADAS ================= */

async function loadLiked(){

  show(tracksScreen);

  document.getElementById(
    "tracksTitle"
  ).textContent =
  "MIS CANCIONES";

  var box = document.getElementById(
    "tracksResults"
  );

  box.innerHTML =
  "<div class='empty'>Cargando canciones guardadas...</div>";

  try{

    /* ENDPOINT CORREGIDO */
    var data = await spotify(
      API + "/me/tracks?limit=50"
    );

    box.innerHTML = "";

    if(!data.items || data.items.length === 0){

      box.innerHTML =
      "<div class='empty'>" +
      "No tienes canciones guardadas" +
      "</div>";

      setStatus("0 canciones");
      return;
    }

    var count = 0;

    data.items.forEach(function(entry){

      var track = entry.track;

      if(!track){
        return;
      }

      count++;

      var item = document.createElement("div");
      item.className = "item";

      item.innerHTML =
      "<div class='item-title'>" +
      escapeHTML(track.name) +
      "</div>" +
      "<div class='item-subtitle'>" +
      escapeHTML(
        (track.artists || []).map(function(a){
          return a.name;
        }).join(", ")
      ) +
      "</div>";

      addButton(item,function(){
        openTrack(track);
      });

      box.appendChild(item);
    });

    setStatus(
      count +
      " canciones guardadas"
    );

  }catch(error){
    handleError(error);
  }
}


/* ================= BUSQUEDA ================= */

async function searchSpotify(){

  var input = document.getElementById(
    "searchInput"
  );

  var query = input.value.trim();

  if(!query){
    setStatus("Escribe una búsqueda");
    return;
  }

  var box = document.getElementById(
    "searchResults"
  );

  box.innerHTML =
  "<div class='empty'>Buscando...</div>";

  try{

    var data = await spotify(
      API +
      "/search?type=track&limit=20&q=" +
      encodeURIComponent(query)
    );

    box.innerHTML = "";

    if(!data.tracks ||
       !data.tracks.items ||
       data.tracks.items.length === 0){

      box.innerHTML =
      "<div class='empty'>Sin resultados</div>";

      return;
    }

    data.tracks.items.forEach(function(track){

      var item = document.createElement("div");
      item.className = "item";

      item.innerHTML =
      "<div class='item-title'>" +
      escapeHTML(track.name) +
      "</div>" +
      "<div class='item-subtitle'>" +
      escapeHTML(
        (track.artists || []).map(function(a){
          return a.name;
        }).join(", ")
      ) +
      "</div>";

      addButton(item,function(){
        openTrack(track);
      });

      box.appendChild(item);
    });

    setStatus(
      data.tracks.items.length +
      " resultados"
    );

  }catch(error){
    handleError(error);
  }
}


/* ================= ABRIR CANCION ================= */

function openTrack(track){

  setStatus(
    "Abriendo en Spotify..."
  );

  window.location.href =
  "https://open.spotify.com/track/" +
  track.id;
}


/* ================= REPRODUCCION ================= */

async function loadCurrent(){

  show(playerScreen);

  var info = document.getElementById(
    "playerInfo"
  );

  info.innerHTML =
  "<div class='player-title'>Cargando...</div>";

  try{

    var data = await spotify(
      API + "/me/player"
    );

    if(!data || !data.item){

      info.innerHTML =
      "<div class='player-title'>" +
      "Nada reproduciéndose" +
      "</div>" +
      "<div class='player-artist'>—</div>";

      setStatus("No hay reproducción");
      return;
    }

    var track = data.item;

    info.innerHTML =
    "<div class='player-title'>" +
    escapeHTML(track.name) +
    "</div>" +
    "<div class='player-artist'>" +
    escapeHTML(
      (track.artists || []).map(function(a){
        return a.name;
      }).join(", ")
    ) +
    "</div>";

    document.getElementById(
      "playBtn"
    ).textContent =
    data.is_playing ? "Ⅱ" : "▶";

    setStatus(
      data.is_playing ?
      "Reproduciendo" :
      "Pausado"
    );

  }catch(error){
    handleError(error);
  }
}


async function togglePlay(){

  try{

    var data = await spotify(
      API + "/me/player"
    );

    if(data && data.is_playing){

      await spotify(
        API + "/me/player/pause",
        {method:"PUT"}
      );

      setStatus("Pausado");

    }else{

      await spotify(
        API + "/me/player/play",
        {method:"PUT"}
      );

      setStatus("Reproduciendo");
    }

    setTimeout(loadCurrent,700);

  }catch(error){
    handleError(error);
  }
}


async function nextTrack(){

  try{

    await spotify(
      API + "/me/player/next",
      {method:"POST"}
    );

    setStatus("Siguiente canción");

    setTimeout(loadCurrent,700);

  }catch(error){
    handleError(error);
  }
}


async function previousTrack(){

  try{

    await spotify(
      API + "/me/player/previous",
      {method:"POST"}
    );

    setStatus("Canción anterior");

    setTimeout(loadCurrent,700);

  }catch(error){
    handleError(error);
  }
}


/* ================= ERRORES ================= */

function handleError(error){

  console.log(error);

  if(error.message === "NO_LOGIN"){
    setStatus(
      "Primero inicia sesión"
    );
    return;
  }

  if(error.message === "SESSION_EXPIRED"){
    setStatus(
      "Sesión caducada. Inicia sesión otra vez"
    );
    return;
  }

  setStatus(
    "Error: " + error.message
  );
}


/* ================= LOGOUT ================= */

function logout(){

  localStorage.removeItem(
    "spotify_access_token"
  );

  localStorage.removeItem(
    "spotify_refresh_token"
  );

  localStorage.removeItem(
    "spotify_expires"
  );

  localStorage.removeItem(
    "spotify_code_verifier"
  );

  localStorage.removeItem(
    "spotify_state"
  );

  setStatus(
    "Sesión cerrada"
  );
}


/* ================= BOTONES ================= */

addButton(
  document.getElementById("loginBtn"),
  login
);

addButton(
  document.getElementById("searchBtn"),
  function(){
    show(searchScreen);
    setStatus("Busca una canción");
  }
);

addButton(
  document.getElementById("playlistBtn"),
  loadPlaylists
);

addButton(
  document.getElementById("likedBtn"),
  loadLiked
);

addButton(
  document.getElementById("currentBtn"),
  loadCurrent
);

addButton(
  document.getElementById("logoutBtn"),
  logout
);

addButton(
  document.getElementById("searchGo"),
  searchSpotify
);

addButton(
  document.getElementById("searchBack"),
  homePage
);

addButton(
  document.getElementById("playlistBack"),
  homePage
);

addButton(
  document.getElementById("tracksBack"),
  homePage
);

addButton(
  document.getElementById("playerBack"),
  homePage
);

addButton(
  document.getElementById("refreshPlayer"),
  loadCurrent
);

addButton(
  document.getElementById("playBtn"),
  togglePlay
);

addButton(
  document.getElementById("nextBtn"),
  nextTrack
);

addButton(
  document.getElementById("previousBtn"),
  previousTrack
);


/* ================= TECLADO ================= */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape" ||
      event.key === "ArrowLeft"
    ){
      homePage();
    }

    if(
      event.key === "Enter" &&
      searchScreen.className.indexOf("active") !== -1
    ){
      searchSpotify();
    }

  }
);


/* ================= INICIO ================= */

processCallback();

</script>

</body>
</html>
