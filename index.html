<script>

/* ====================================================
   CONFIGURACION
==================================================== */

var CLIENT_ID =
"8b61d543ab204a01986a47f38e419304";

var REDIRECT_URI =
"https://cristiandavoh-svg.github.io/Cloudphone-widget/";

var API =
"https://api.spotify.com/v1";


/*
 * IMPORTANTE:
 * streaming es necesario para Web Playback SDK.
 */

var SCOPES =
"user-read-private " +
"user-read-email " +
"playlist-read-private " +
"playlist-read-collaborative " +
"user-library-read " +
"user-read-playback-state " +
"user-read-currently-playing " +
"user-modify-playback-state " +
"streaming";


/* ====================================================
   ELEMENTOS
==================================================== */

var home =
document.getElementById("home");

var searchScreen =
document.getElementById("searchScreen");

var playlistScreen =
document.getElementById("playlistScreen");

var tracksScreen =
document.getElementById("tracksScreen");

var playerScreen =
document.getElementById("playerScreen");

var currentScreen =
document.getElementById("currentScreen");

var status =
document.getElementById("status");

var deviceStatus =
document.getElementById("deviceStatus");


/* ====================================================
   UTILIDADES
==================================================== */

function setStatus(text){
  status.textContent = text;
}


function show(screen){

  home.className = "screen";
  searchScreen.className = "screen";
  playlistScreen.className = "screen";
  tracksScreen.className = "screen";
  playerScreen.className = "screen";
  currentScreen.className = "screen";

  screen.className =
  "screen active";
}


function homePage(){

  show(home);

  setStatus(
    "Menu principal"
  );
}


function escapeHTML(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function addButton(element,callback){

  element.addEventListener(
    "click",
    callback,
    false
  );

  element.addEventListener(
    "touchend",
    function(e){

      e.preventDefault();

      callback();

    },
    false
  );
}


/* ====================================================
   PKCE
==================================================== */

function randomString(length){

  var chars =
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
  "abcdefghijklmnopqrstuvwxyz" +
  "0123456789";

  var result = "";

  var values =
  new Uint8Array(length);

  crypto.getRandomValues(values);

  for(
    var i=0;
    i<length;
    i++
  ){

    result +=
    chars[
      values[i] % chars.length
    ];

  }

  return result;
}


function base64url(buffer){

  var bytes =
  new Uint8Array(buffer);

  var binary = "";

  for(
    var i=0;
    i<bytes.byteLength;
    i++
  ){

    binary +=
    String.fromCharCode(
      bytes[i]
    );

  }

  return btoa(binary)
    .replace(/\+/g,"-")
    .replace(/\//g,"_")
    .replace(/=+$/,"");
}


async function createChallenge(verifier){

  var encoder =
  new TextEncoder();

  var data =
  encoder.encode(verifier);

  var digest =
  await crypto.subtle.digest(
    "SHA-256",
    data
  );

  return base64url(digest);
}


/* ====================================================
   LOGIN
==================================================== */

async function login(){

  try{

    if(
      !window.crypto ||
      !window.crypto.subtle
    ){

      setStatus(
        "PKCE no compatible"
      );

      return;
    }

    setStatus(
      "Preparando Spotify..."
    );

    var verifier =
    randomString(64);

    var challenge =
    await createChallenge(
      verifier
    );

    var state =
    randomString(32);

    localStorage.setItem(
      "spotify_code_verifier",
      verifier
    );

    localStorage.setItem(
      "spotify_state",
      state
    );

    var auth =
    new URL(
      "https://accounts.spotify.com/authorize"
    );

    auth.search =
    new URLSearchParams({

      client_id:
      CLIENT_ID,

      response_type:
      "code",

      redirect_uri:
      REDIRECT_URI,

      scope:
      SCOPES,

      state:
      state,

      code_challenge_method:
      "S256",

      code_challenge:
      challenge

    });

    window.location.href =
    auth.toString();

  }
  catch(error){

    console.log(error);

    setStatus(
      "Error iniciando Spotify"
    );

  }
}


/* ====================================================
   CALLBACK
==================================================== */

async function processCallback(){

  var params =
  new URLSearchParams(
    window.location.search
  );

  var error =
  params.get("error");

  var code =
  params.get("code");

  if(error){

    setStatus(
      "Spotify: " + error
    );

    return;
  }

  if(!code){

    return;
  }

  var savedState =
  localStorage.getItem(
    "spotify_state"
  );

  var returnedState =
  params.get("state");

  if(
    savedState &&
    returnedState !== savedState
  ){

    setStatus(
      "Error de seguridad"
    );

    return;
  }

  var verifier =
  localStorage.getItem(
    "spotify_code_verifier"
  );

  if(!verifier){

    setStatus(
      "Falta PKCE"
    );

    return;
  }

  try{

    setStatus(
      "Conectando con Spotify..."
    );

    var response =
    await fetch(
      "https://accounts.spotify.com/api/token",
      {

        method:"POST",

        headers:{
          "Content-Type":
          "application/x-www-form-urlencoded"
        },

        body:
        new URLSearchParams({

          client_id:
          CLIENT_ID,

          grant_type:
          "authorization_code",

          code:
          code,

          redirect_uri:
          REDIRECT_URI,

          code_verifier:
          verifier

        })

      }
    );

    var data =
    await response.json();

    if(!response.ok){

      console.log(data);

      setStatus(
        "Spotify rechazo el login"
      );

      return;
    }

    localStorage.setItem(
      "spotify_access_token",
      data.access_token
    );

    if(data.refresh_token){

      localStorage.setItem(
        "spotify_refresh_token",
        data.refresh_token
      );

    }

    localStorage.setItem(
      "spotify_expires",
      String(
        Date.now() +
        data.expires_in * 1000
      )
    );

    localStorage.removeItem(
      "spotify_code_verifier"
    );

    localStorage.removeItem(
      "spotify_state"
    );

    window.history.replaceState(
      {},
      document.title,
      REDIRECT_URI
    );

    setStatus(
      "Spotify conectado ✓"
    );

  }
  catch(error){

    console.log(error);

    setStatus(
      "Error conectando Spotify"
    );

  }

}


/* ====================================================
   TOKEN
==================================================== */

function getToken(){

  return localStorage.getItem(
    "spotify_access_token"
  );

}


/* ====================================================
   SPOTIFY API
==================================================== */

async function spotify(
  url,
  options
){

  var token =
  getToken();

  if(!token){

    throw new Error(
      "NO_LOGIN"
    );

  }

  options =
  options || {};

  options.headers =
  options.headers || {};

  options.headers.Authorization =
  "Bearer " + token;

  var response =
  await fetch(
    url,
    options
  );

  if(
    response.status === 401
  ){

    localStorage.removeItem(
      "spotify_access_token"
    );

    throw new Error(
      "SESSION_EXPIRED"
    );

  }

  if(
    response.status === 204
  ){

    return null;

  }

  var data;

  try{

    data =
    await response.json();

  }
  catch(e){

    data = {};

  }

  if(!response.ok){

    throw new Error(
      data.error &&
      data.error.message
      ?
      data.error.message
      :
      "Error Spotify"
    );

  }

  return data;
}


/* ====================================================
   WEB PLAYBACK SDK
==================================================== */

var spotifyPlayer = null;

var nokiaDeviceId = null;

var sdkLoaded = false;

var sdkReady = false;


/*
 * Esta funcion es llamada automaticamente
 * por Spotify cuando carga el SDK.
 */

window.onSpotifyWebPlaybackSDKReady =
function(){

  sdkLoaded = true;

  setStatus(
    "SDK de Spotify cargado"
  );

  if(!getToken()){

    deviceStatus.innerHTML =
    "Inicia sesión primero";

    return;
  }

  initializePlayer();

};


/* ====================================================
   INICIALIZAR PLAYER
==================================================== */

function initializePlayer(){

  if(
    !window.Spotify ||
    !window.Spotify.Player
  ){

    deviceStatus.innerHTML =
    "<span class='bad'>" +
    "SDK no disponible" +
    "</span>";

    return;
  }


  deviceStatus.textContent =
  "Inicializando Nokia...";


  spotifyPlayer =
  new Spotify.Player({

    name:
    "Nokia 105 4G - CloudPhone",

    getOAuthToken:
    function(callback){

      var token =
      getToken();

      callback(token);

    },

    volume:0.7,

    enableMediaSession:true

  });


  /* READY */

  spotifyPlayer.addListener(
    "ready",
    function(data){

      nokiaDeviceId =
      data.device_id;

      sdkReady = true;

      deviceStatus.innerHTML =
      "<span class='good'>" +
      "✓ Nokia disponible" +
      "</span>";

      setStatus(
        "Reproductor Nokia listo"
      );

      console.log(
        "Nokia Device ID:",
        nokiaDeviceId
      );

    }
  );


  /* NOT READY */

  spotifyPlayer.addListener(
    "not_ready",
    function(data){

      sdkReady = false;

      deviceStatus.innerHTML =
      "<span class='bad'>" +
      "Nokia desconectado" +
      "</span>";

      console.log(
        "Device offline:",
        data.device_id
      );

    }
  );


  /* INITIALIZATION ERROR */

  spotifyPlayer.addListener(
    "initialization_error",
    function(data){

      deviceStatus.innerHTML =
      "<span class='bad'>" +
      "✕ Nokia no compatible" +
      "</span>";

      setStatus(
        "Error de reproducción: " +
        data.message
      );

      console.log(
        "INITIALIZATION ERROR:",
        data.message
      );

    }
  );


  /* AUTH ERROR */

  spotifyPlayer.addListener(
    "authentication_error",
    function(data){

      deviceStatus.innerHTML =
      "<span class='bad'>" +
      "Error de autenticación" +
      "</span>";

      setStatus(
        "Auth: " +
        data.message
      );

    }
  );


  /* ACCOUNT ERROR */

  spotifyPlayer.addListener(
    "account_error",
    function(data){

      deviceStatus.innerHTML =
      "<span class='bad'>" +
      "Cuenta no compatible" +
      "</span>";

      setStatus(
        "Se necesita Spotify Premium"
      );

    }
  );


  /* PLAYBACK ERROR */

  spotifyPlayer.addListener(
    "playback_error",
    function(data){

      setStatus(
        "Error audio: " +
        data.message
      );

      console.log(
        "PLAYBACK ERROR:",
        data.message
      );

    }
  );


  /* AUTOPLAY */

  spotifyPlayer.addListener(
    "autoplay_failed",
    function(){

      setStatus(
        "Pulsa ACTIVAR AUDIO"
      );

    }
  );


  /* TRACK */

  spotifyPlayer.addListener(
    "player_state_changed",
    function(state){

      if(!state){

        return;
      }

      var track =
      state.track_window.current_track;

      if(!track){

        return;
      }

      document.getElementById(
        "playerInfo"
      ).innerHTML =

      "<div class='player-title'>" +
      escapeHTML(
        track.name
      ) +
      "</div>" +

      "<div class='player-artist'>" +
      escapeHTML(
        track.artists
        .map(function(a){
          return a.name;
        })
        .join(", ")
      ) +
      "</div>";

      document.getElementById(
        "playBtn"
      ).textContent =
      state.paused
      ? "▶"
      : "Ⅱ";

    }
  );


  /*
   * IMPORTANTE:
   * activateElement ayuda con las
   * restricciones de autoplay.
   */

  spotifyPlayer.connect()
    .then(function(success){

      if(success){

        setStatus(
          "Spotify Player conectado"
        );

      }else{

        setStatus(
          "No se pudo conectar"
        );

      }

    })
    .catch(function(error){

      console.log(error);

      setStatus(
        "No compatible con este navegador"
      );

    });

}


/* ====================================================
   ACTIVAR AUDIO
==================================================== */

async function activateAudio(){

  if(!spotifyPlayer){

    setStatus(
      "El reproductor todavía no está listo"
    );

    return;
  }

  try{

    if(
      spotifyPlayer.activateElement
    ){

      await spotifyPlayer.activateElement();

    }

    setStatus(
      "Audio activado"
    );

  }
  catch(error){

    console.log(error);

    setStatus(
      "No se pudo activar el audio"
    );

  }

}


/* ====================================================
   TRANSFERIR A NOKIA
==================================================== */

async function transferToNokia(){

  if(!nokiaDeviceId){

    setStatus(
      "El Nokia todavía no está disponible"
    );

    return;
  }

  try{

    await spotify(
      API + "/me/player",
      {

        method:"PUT",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({

          device_ids:[
            nokiaDeviceId
          ],

          play:false

        })

      }
    );

    setStatus(
      "Reproducción enviada al Nokia"
    );

    /*
     * Actualizamos después de transferir.
     */

    setTimeout(
      loadCurrent,
      800
    );

  }
  catch(error){

    handleError(error);

  }

}

/* ====================================================
   PLAYLISTS
==================================================== */

async function loadPlaylists(){

  show(playlistScreen);

  var box =
  document.getElementById(
    "playlistResults"
  );

  box.innerHTML =
  "<div class='empty'>" +
  "Cargando playlists..." +
  "</div>";

  try{

    var data =
    await spotify(
      API +
      "/me/playlists?limit=50"
    );

    box.innerHTML = "";

    if(
      !data.items ||
      data.items.length === 0
    ){

      box.innerHTML =
      "<div class='empty'>" +
      "No hay playlists" +
      "</div>";

      return;
    }

    data.items.forEach(
      function(playlist){

        var item =
        document.createElement(
          "div"
        );

        item.className =
        "item";

        var total = 0;

        if(
          playlist.items &&
          typeof playlist.items.total !==
          "undefined"
        ){

          total =
          playlist.items.total;

        }
        else if(
          playlist.tracks &&
          typeof playlist.tracks.total !==
          "undefined"
        ){

          total =
          playlist.tracks.total;

        }

        item.innerHTML =

        "<div class='item-title'>" +
        escapeHTML(
          playlist.name
        ) +
        "</div>" +

        "<div class='item-subtitle'>" +
        total +
        " canciones" +
        "</div>";

        addButton(
          item,
          function(){

            loadPlaylist(
              playlist.id,
              playlist.name
            );

          }
        );

        box.appendChild(item);

      }
    );

    setStatus(
      data.items.length +
      " playlists"
    );

  }
  catch(error){

    handleError(error);

  }

}


/* ====================================================
   PLAYLIST TRACKS
==================================================== */

async function loadPlaylist(
  id,
  name
){

  show(tracksScreen);

  document.getElementById(
    "tracksTitle"
  ).textContent =
  name;

  var box =
  document.getElementById(
    "tracksResults"
  );

  box.innerHTML =
  "<div class='empty'>" +
  "Cargando..." +
  "</div>";

  try{

    var data =
    await spotify(
      API +
      "/playlists/" +
      encodeURIComponent(id) +
      "/items?limit=50"
    );

    box.innerHTML = "";

    var count = 0;

    data.items.forEach(
      function(entry){

        var track =
        entry.item;

        if(
          !track ||
          track.type !== "track"
        ){

          return;

/* ====================================================
   REPRODUCIR TRACK EN EL NOKIA
==================================================== */

async function playTrack(uri){

  if(!nokiaDeviceId){

    setStatus(
      "El Nokia no está conectado"
    );

    show(playerScreen);

    return;

  }

  try{

    await spotify(
      API + "/me/player",
      {

        method:"PUT",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({

          device_ids:[
            nokiaDeviceId
          ],

          play:true

        })

      }
    );

    /*
     * Después de transferir el dispositivo,
     * inicia la pista solicitada.
     */

    await spotify(
      API + "/me/player/play",
      {

        method:"PUT",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({

          uris:[
            uri
          ]

        })

      }
    );

    setStatus(
      "Reproduciendo en Nokia"
    );

    show(playerScreen);

  }
  catch(error){

    handleError(error);

  }

}

/* ====================================================
   ERROR
==================================================== */

function handleError(error){

  console.log(error);

  if(
    error.message ===
    "NO_LOGIN"
  ){

    setStatus(
      "Inicia sesión primero"
    );

    return;

  }

  if(
    error.message ===
    "SESSION_EXPIRED"
  ){

    setStatus(
      "Sesión caducada"
    );

    return;

  }

  setStatus(
    "Error: " +
    error.message
  );

}


/* ====================================================
   LOGOUT
==================================================== */

function logout(){

  if(spotifyPlayer){

    try{
      spotifyPlayer.disconnect();
    }
    catch(e){}

  }

  spotifyPlayer = null;
  nokiaDeviceId = null;
  sdkReady = false;

  localStorage.removeItem(
    "spotify_access_token"
  );

  localStorage.removeItem(
    "spotify_refresh_token"
  );

  localStorage.removeItem(
    "spotify_expires"
  );

  localStorage.removeItem(
    "spotify_code_verifier"
  );

  localStorage.removeItem(
    "spotify_state"
  );

  deviceStatus.textContent =
  "Sin iniciar sesión";

  setStatus(
    "Sesión cerrada"
  );

}

/* ====================================================
   BUSQUEDA
==================================================== */

async function searchSpotify(){

  var input =
  document.getElementById(
    "searchInput"
  );

  var query =
  input.value.trim();

  if(!query){

    setStatus(
      "Escribe una búsqueda"
    );

    return;

  }

  var box =
  document.getElementById(
    "searchResults"
  );

  box.innerHTML =
  "<div class='empty'>" +
  "Buscando..." +
  "</div>";

  try{

    var data =
    await spotify(
      API +
      "/search?type=track&limit=20&q=" +
      encodeURIComponent(query)
    );

    box.innerHTML = "";

    data.tracks.items.forEach(
      function(track){

        var item =
        document.createElement(
          "div"
        );

        item.className =
        "item";

        item.innerHTML =

        "<div class='item-title'>" +
        escapeHTML(
          track.name
        ) +
        "</div>" +

        "<div class='item-subtitle'>" +
        escapeHTML(
          track.artists
          .map(function(a){
            return a.name;
          })
          .join(", ")
        ) +
        "</div>";

        addButton(
          item,
          function(){

            playTrack(
              track.uri
            );

          }
        );

        box.appendChild(item);

      }
    );

    setStatus(
      data.tracks.items.length +
      " resultados"
    );

  }
  catch(error){

    handleError(error);

  }

}
